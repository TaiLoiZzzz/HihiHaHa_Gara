version: '3.8'

# ==============================================================================
# HIHIHAHA AUTO GARAGE - PRODUCTION DOCKER COMPOSE ORCHESTRATION
# Architecture:
#   - Frontend: Next.js 14 Standalone (Port 8888 -> Internal 3000)
#   - Backend: Node.js Express REST + WebSocket API (Internal 5000)
#   - Polyglot Persistence: PostgreSQL, MongoDB, Redis, Neo4j
# Security & Reliability:
#   - Zero public DB exposure (Bridge network only)
#   - Healthcheck dependencies (wait for DBs ready before starting backend)
#   - Resource limits (Prevent host OOM crashes)
#   - Log rotation (Prevent disk exhaustion)
# ==============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND: Next.js 14 Multi-stage Standalone (~120MB)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../../client
      dockerfile: Dockerfile
    container_name: hihihaha_frontend_prod
    restart: always
    ports:
      - "8888:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_BACKEND_URL: http://backend:5000
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_started
    networks:
      - hihihaha_internal_net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 256M
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 2. BACKEND: Express REST API, WebSockets & Outbox Worker
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: hihihaha_backend_prod
    restart: always
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/hihihaha_db
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      PG_DATABASE: hihihaha_db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-hihihaha_super_secret_jwt_key_2026_secured}
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - hihihaha_internal_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 384M
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 3. POLYGLOT DATABASES (ZERO PUBLIC HOST PORT MAPPING)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: hihihaha_mongo_prod
    restart: always
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: hihihaha_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hihihaha_internal_net
    deploy:
      resources:
        limits:
          memory: 1536M
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: hihihaha_postgres_prod
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: hihihaha_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hihihaha_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hihihaha_internal_net
    deploy:
      resources:
        limits:
          memory: 1024M
    logging: *default-logging

  neo4j:
    image: neo4j:5-community
    container_name: hihihaha_neo4j_prod
    restart: always
    expose:
      - "7474"
      - "7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j123456}
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
      NEO4J_dbms_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks:
      - hihihaha_internal_net
    deploy:
      resources:
        limits:
          memory: 1280M
    logging: *default-logging

  redis:
    image: redis:7.2-alpine
    container_name: hihihaha_redis_prod
    restart: always
    expose:
      - "6379"
    command: redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - hihihaha_internal_net
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

# ------------------------------------------------------------------------------
# ISOLATED BRIDGE NETWORK & PERSISTENT DATA VOLUMES
# ------------------------------------------------------------------------------
networks:
  hihihaha_internal_net:
    driver: bridge
    name: hihihaha_internal_net

volumes:
  mongo_data:
    name: hihihaha_mongo_data
  pg_data:
    name: hihihaha_pg_data
  neo4j_data:
    name: hihihaha_neo4j_data
  redis_data:
    name: hihihaha_redis_data
